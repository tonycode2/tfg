<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="css/reportes.css"/>
    <style>@page { size: A4 portrait; }</style>
    <title>Proyección de Cesantía</title>
</head>
<body>
    <div class="reporte-header">
        <div class="header-logo"><img src="logo.png" alt="Logo"/></div>
        <div class="header-info">
            <div class="empresa-nombre" th:text="${dto.nombreEmpresa}">Empresa</div>
            <div class="reporte-titulo">Proyección de Cesantía</div>
        </div>
        <div class="header-fecha">Generado: <span th:text="${dto.fechaGeneracion}"/></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Empleado</th>
                <th>Cédula</th>
                <th>Ingreso</th>
                <th>Salario</th>
                <th>Días Cesantía</th>
                <th>Proyección (₡)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="d,iter : ${dto.empleados}">
                <td th:text="${iter.index + 1}"></td>
                <td th:text="${d.nombreCompleto}"></td>
                <td th:text="${d.cedula}"></td>
                <td th:text="${d.fechaIngreso}"></td>
                <td th:text="'₡' + ${#numbers.formatDecimal(d.salarioPromedio, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${d.diasCesantia}"></td>
                <td th:text="'₡' + ${#numbers.formatDecimal(d.montoEstimado, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
        </tbody>
    </table>

    <div class="reporte-footer">Total proyección: ₡<span th:text="${#numbers.formatDecimal(dto.montoTotalProyectado, 1, 'COMMA', 2, 'POINT')}"></span></div>
</body>
</html>
