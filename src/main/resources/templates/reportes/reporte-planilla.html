<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="css/reportes.css"/>
    <title>Reporte de Planilla</title>
</head>
<body>
    <div class="reporte-header">
        <div class="header-logo">
            <img src="logo.png" alt="Logo"/>
        </div>
        <div class="header-info">
            <div class="empresa-nombre" th:text="${dto.nombreEmpresa}">Empresa</div>
            <div class="reporte-titulo" th:text="${dto.tituloReporte}">Reporte</div>
            <div class="reporte-periodo">
                Período: <span th:text="${dto.fechaInicioPeriodo}"/> — <span th:text="${dto.fechaFinPeriodo}"/>
                | Quincena: <span th:text="${dto.tipoQuincena}"/>
            </div>
        </div>
        <div class="header-fecha">
            Generado: <span th:text="${dto.fechaGeneracion}"/>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Puesto</th>
                <th>Depto.</th>
                <th class="col-monto">Sal. Base</th>
                <th class="col-monto">H. Extra</th>
                <th class="col-monto">Incap.</th>
                <th class="col-monto">Feriados</th>
                <th class="col-monto">Devengado</th>
                <th class="col-monto">CCSS IVM</th>
                <th class="col-monto">CCSS SEM</th>
                <th class="col-monto">Renta</th>
                <th class="col-monto">Otras</th>
                <th class="col-monto">Deduc.</th>
                <th class="col-monto">Neto</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${dto.empleados}">
                <td th:text="${emp.cedula}"></td>
                <td th:text="${emp.nombreCompleto}"></td>
                <td th:text="${emp.puesto}"></td>
                <td th:text="${emp.departamento}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.salarioBase, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.montoHorasExtra, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.montoIncapacidad, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.montoFeriadosTrabajados, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.totalDevengado, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.deduccionCcssIvm, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.deduccionCcssSem, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.impuestoDeRenta, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.otrasDeducciones, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.totalDeducciones, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(emp.salarioNeto, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="fila-total">
                <td colspan="8" style="text-align: right;">TOTALES:</td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(dto.totalBruto, 1, 'COMMA', 2, 'POINT')}"></td>
                <td colspan="4"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(dto.totalDeducciones, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-monto" th:text="${#numbers.formatDecimal(dto.totalNeto, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
        </tfoot>
    </table>

    <div class="reporte-footer">
        Generado por el Sistema de Gestión de RH — <span th:text="${dto.nombreEmpresa}"/>
    </div>
</body>
</html>
